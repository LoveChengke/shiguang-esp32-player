[platformio]
default_envs = esp32
core_dir = .pio-core

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
  earlephilhower/ESP8266Audio@2.0.0
  lovyan03/LovyanGFX@1.2.35
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> -<diagnostic.cpp>

; Reference wiring for WROOM / DevKit V1; identify the real board before upload.
[env:esp32]
board = esp32dev
build_flags = ${env.build_flags} -DPOCKET_BOARD_ESP32

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags = ${env.build_flags} -DPOCKET_BOARD_S3 -DBOARD_HAS_PSRAM

[env:diagnostic]
board = esp32dev
build_src_filter = -<*> +<diagnostic.cpp>
build_flags = ${env.build_flags} -DPOCKET_BOARD_ESP32
